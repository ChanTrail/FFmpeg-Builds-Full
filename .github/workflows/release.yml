# 发布（驱动 + FFmpeg 产物）：master 上 CI 全绿后由 ci.yml 尾部的
# release job 发 repository_dispatch 调起。本 workflow 不再重编任何
# 东西——Driver-v* 与 FFmpeg 日期 release 发布的都是"CI run 里已验
# 证的产物"（按 run-id 跨 run 拉 Driver-*/ffmpeg-* artifact）。手动触
# 发同理，但同样受"CI 未绿不发布"约束，且产物取自本分支最近一次成
# 功 CI run。
# Publishing (driver + FFmpeg artifacts): invoked via
# repository_dispatch from ci.yml's tail release job once CI is green
# on master. Nothing here rebuilds anything — the Driver-v* and dated
# FFmpeg releases ship exactly what the CI run already verified (the
# Driver-*/ffmpeg-* artifacts are pulled cross-run by run-id). A manual
# dispatch works the same way — bound by the same "no release without
# green CI" rule, and artifacts come from the branch's latest
# successful CI run.
name: Release

on:
  # 由 ci.yml 尾部的 release job 发 repository_dispatch 调起——它
  # needs test/driver/build/prepare 全绿且仅 master push。dispatch 产
  # 生独立 run 与独立 artifact 命名空间：workflow_call 曾把本工作流
  # 的 job 内联进 CI run 并共享命名空间，CI/release 两边的
  # driver-<p> artifact 撞名导致组装步拿到无 sha256 的 CI 版。CI 红
  # 时这里连"触发但跳过"的条目都不产生（workflow_run 事件没有结论
  # 过滤器，completed 含失败，旧实现永远会留一条全跳过的记录）。
  # invoked via repository_dispatch fired by ci.yml's tail release job,
  # which needs test/driver/build/prepare green and only fires on
  # master pushes. A dispatch yields its own run with its own artifact
  # namespace — workflow_call used to inline this workflow's jobs into
  # the CI run and share the namespace, where CI/release driver-<p>
  # artifacts collided and the assemble step got CI's sha256-less copy.
  # A red CI leaves no "triggered but skipped" standalone entry here
  # at all (the workflow_run event has no conclusion filter — completed
  # includes failures — so the old design always logged a fully-skipped
  # record).
  repository_dispatch:
    types: [Release]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run to lift artifacts from (default: latest successful CI run on this branch)"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 版本变化探测 + 产物源解析 / Version-change detection + artifact source
  # 从 Cargo.toml 读版本号：对应 tag Driver-v<版本> 不存在才算"版本
  # 变化"——驱动发布按此门控。FFmpeg 产物发布不做版本门：绿 CI 的产
  # 物照发（日期 tag 按 FFmpeg commit 走，与驱动版本无关）。
  # Read the version from Cargo.toml: "changed" means the tag
  # Driver-v<version> does not exist yet — the driver release gates on
  # it. The FFmpeg product release is ungated: a green CI's products
  # always ship (date tags track the FFmpeg commit, not the driver
  # version).
  version:
    name: Detect version + artifact run
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      actions: read # gh run list / artifact run resolution
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      run_id: ${{ steps.rid.outputs.run_id }}
      ffmpeg_sha: ${{ steps.ff.outputs.sha }}
    steps:
      # 检出必须是"被 CI 测过的那个 commit"（dispatch 载荷传入），而
      # 不是此刻的 master 头（CI 跑完到发布之间可能有新 push）；手动
      # 触发回退到 dispatch 时的分支头 / the checkout must be the exact
      # CI-tested commit (carried in the dispatch payload), not whatever
      # master head is now (new pushes may land between CI finishing and
      # the release); manual dispatch falls back to the branch head
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0

      # 手动触发同样受"CI 未绿不 Release"约束：查本分支最近一次已完成
      # 的 CI 结论，非 success 直接拦下。不要求 headSha 对齐——
      # paths-ignore 跳过的提交（纯文档等）没有自己的 run，最近一次已
      # 完成 run 就代表了可测状态；对不上时只发 notice。
      # Manual dispatches obey "no release without green CI" as well:
      # check the newest COMPLETED CI run on this branch and block unless
      # it concluded success. headSha alignment is not required — commits
      # skipped by paths-ignore (docs-only etc.) own no run, so the
      # latest completed run speaks for the testable state; a drift only
      # earns a notice.
      - name: Gate manual dispatch on latest CI conclusion
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          row="$(gh run list --workflow ci.yml --branch "${{ github.ref_name }}" \
            --status completed --limit 1 --json conclusion,headSha \
            -q '.[0] | "\(.conclusion // "none") \(.headSha // "none")"')"
          concl="${row%% *}"; sha="${row##* }"
          echo "latest completed CI on ${{ github.ref_name }}: ${concl:-none} @ ${sha:0:10}"
          [[ "$concl" == success ]] \
            || { echo "::error::refusing to release: latest CI conclusion is '${concl:-none}'"; exit 1; }
          [[ "$sha" == "${{ github.sha }}" ]] \
            || echo "::notice::latest green CI is ${sha:0:10}, dispatched sha is ${GITHUB_SHA:0:10} (paths-ignore drift)"

      # 产物来源 run：dispatch 载荷 → 手动输入 → 本分支最近一次成功
      # CI run。后续 job 按它跨 run 下载 Driver-*/ffmpeg-* artifact。
      # Artifact source run: dispatch payload -> manual input -> the
      # branch's latest successful CI run. Downstream jobs download the
      # Driver-*/ffmpeg-* artifacts cross-run by this id.
      - name: Resolve artifact source run
        id: rid
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rid="${{ github.event.client_payload.run_id || inputs.run_id }}"
          if [ -z "$rid" ]; then
            rid="$(gh run list --workflow ci.yml --branch "${{ github.ref_name }}" \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')"
            echo "resolved latest successful CI run: $rid"
          fi
          [[ -n "$rid" && "$rid" != "null" ]] \
            || { echo "::error::no successful CI run to lift artifacts from"; exit 1; }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      # FFmpeg 源 commit：dispatch 载荷（CI prepare 实解值）优先；手动
      # 无载荷时留空——ffmpeg-release 从产物包内 BUILDINFO.info 反解，
      # 那是"实际构建的 commit"的权威出处 / FFmpeg source commit: the
      # dispatch payload (CI's prepare-resolved value) wins; manual
      # runs carry none — ffmpeg-release then back-solves it from the
      # BUILDINFO.info inside a shipped archive, the authoritative
      # record of the actually-built commit
      - name: Propagate FFmpeg commit
        id: ff
        run: echo "sha=${{ github.event.client_payload.ffmpeg_sha }}" >> "$GITHUB_OUTPUT"

      - name: Read version / probe tag
        id: v
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [[ -n "$ver" ]] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # Driver tag 约定：Driver-v<版本> / Driver tag convention:
          # Driver-v<version>
          echo "tag=Driver-v$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "Driver-v$ver" | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag Driver-v$ver already exists — Driver release skipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed to $ver — will publish the driver."
          fi

  # ── 发布驱动 / Publish the Driver ───────────────────────────────────
  # 产物直接用 CI driver job 的 Driver-<p> artifact（CI 已验证的
  # 二进制），这里只做发布形态打包：windows 固实 7z + sha256，posix
  # 平台名后缀 + sha256——与旧"重编一遍"产物的形态逐位一致。
  # Ships the CI driver job's Driver-<p> artifacts verbatim (the very
  # binaries CI verified); this job only rewraps them into release
  # shape: a solid 7z + sha256 for windows, platform-suffixed name +
  # sha256 elsewhere — bit-identical to the old rebuild's output.
  driver-release:
    name: Release Driver
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      # download-artifact 跨 run 拉取走 actions API——不显式给读权
      # 时 job 级 contents: write 会把它收窄成 none / cross-run
      # artifact downloads go through the actions API — a job-level
      # contents: write alone narrows it to none
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          # 需要历史 tag 来算 Full Changelog 区间 / history tags are
          # needed to compute the Full Changelog range
          fetch-depth: 0

      # 按 run-id 跨 run 拉 CI 的 Driver-* artifact（不 merge——五个
      # 二进制同名，merge 会互相覆盖）/ pull the CI run's Driver-*
      # artifacts cross-run by run-id (no merge — the five binaries
      # share a name and a merge would clobber them)
      - name: Download CI driver artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Driver-*
          path: dist
          run-id: ${{ needs.version.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          for p in windows-x86_64 windows-arm64 linux-x86_64 linux-arm64 macos-arm64; do
            if [[ "$p" == windows-* ]]; then
              # Windows 驱动产物 = 固实 7z（平台后缀名）+ 覆盖它的
              # sha256；.7z 内是调用名二进制，下游 7z x 即用 /
              # windows driver asset = platform-suffixed solid 7z plus
              # its sha256; inside is the invocation-name binary,
              # usable straight after 7z x
              src="dist/Driver-$p/FFmpeg-Builds-Full.exe"
              [[ -f "$src" ]] || { echo "::error::missing $src"; exit 1; }
              f="FFmpeg-Builds-Full-$p.7z"
              (cd "dist/Driver-$p" && 7z a -t7z -mx=9 -ms=on "$f" "FFmpeg-Builds-Full.exe" >/dev/null \
                && sha256sum -- "$f" > "$f.sha256")
              cp "dist/Driver-$p/$f" "dist/Driver-$p/$f.sha256" assets/
            else
              src="dist/Driver-$p/FFmpeg-Builds-Full"
              [[ -f "$src" ]] || { echo "::error::missing $src"; exit 1; }
              cp "$src" "assets/FFmpeg-Builds-Full-$p"
              (cd assets && sha256sum -- "FFmpeg-Builds-Full-$p" > "FFmpeg-Builds-Full-$p.sha256")
            fi
          done
          ls -lh assets/

      # Release 正文按仓库规范拼装：What's Changed → 产物表格 →
      # New Contributors → Full Changelog。
      # The release body is assembled per the repo's release-commit
      # rules: What's Changed -> artifacts table -> New Contributors
      # -> Full Changelog.
      - name: Assemble release body
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag -l 'Driver-*' --sort=-v:refname | head -n1 || true)"
          args=(-f "tag_name=$TAG" -f "target_commitish=${{ needs.version.outputs.sha }}")
          [[ -n "$PREV_TAG" ]] && args+=(-f "previous_tag_name=$PREV_TAG")
          # generate-notes 失败或返回空 body 时兜底：从两个 Driver-* tag
          # 之间的 git log 自造 What's Changed（首个 release 取最近 50
          # 条），并补一行 Full Changelog 链接。
          # Fall back when generate-notes fails or returns an empty body:
          # synthesize What's Changed from the git log between Driver-*
          # tags (the last 50 commits for a first release) and emit a
          # Full Changelog link.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq '.body' > notes.md \
             || [[ ! -s notes.md ]]; then
            echo "::warning::generate-notes unavailable, falling back to git log"
            {
              echo "## What's Changed"
              echo
              if [[ -n "$PREV_TAG" ]]; then
                git log --no-merges --pretty='* %s' "$PREV_TAG..HEAD"
              else
                git log --no-merges --pretty='* %s' -50 HEAD
              fi
            } > notes.md
            if [[ -n "$PREV_TAG" ]]; then
              FALLBACK_CHANGELOG="**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$TAG"
            fi
          fi
          # 按规范顺序重排 notes：What's Changed → 产物表格 →
          # New Contributors → Full Changelog。awk 把 notes 从
          # "### New Contributors" 处劈成 wc.md/nc.md，Full
          # Changelog 行单独摘出来收尾。
          # Reorder the notes per the rules: What's Changed ->
          # artifacts table -> New Contributors -> Full Changelog. awk
          # splits them at "### New Contributors" into wc.md/nc.md and
          # the Full Changelog line is lifted out to close the body.
          CHANGELOG="$(grep -m1 'Full Changelog' notes.md || true)"
          awk '/Full Changelog/ { next } /^### New Contributors/ { nc=1 } { if (nc) print > "nc.md"; else print > "wc.md" }' notes.md
          # wc.md 必须存在：notes 若只有 New Contributors 段或只剩
          # Changelog 行，awk 一行都不往 wc.md 写，cp 会炸。
          # wc.md must exist: notes consisting solely of New
          # Contributors or of just the Changelog line leave awk with
          # nothing to write into wc.md and cp explodes.
          [[ -s wc.md ]] || { echo "## What's Changed"; echo; echo "* _No changes listed._"; } > wc.md
          cp wc.md body.md
          cat >> body.md <<'EOF'

          ## 构建产物 / Artifacts

          | 平台 / Platform | 产物 / Artifact |
          |:--|:--|
          | Windows x86_64 | `FFmpeg-Builds-Full-windows-x86_64.7z` |
          | Windows arm64 | `FFmpeg-Builds-Full-windows-arm64.7z` |
          | Linux x86_64 | `FFmpeg-Builds-Full-linux-x86_64` |
          | Linux arm64 | `FFmpeg-Builds-Full-linux-arm64` |
          | macOS arm64 | `FFmpeg-Builds-Full-macos-arm64` |

          每个产物附带同名 `.sha256` 校验文件（`sha256sum -c` 校验）。
          Every artifact ships a matching `.sha256` checksum file (verify with `sha256sum -c`).
          EOF
          # 无新贡献者时 notes 没有该节，nc.md 为空则不追加
          # notes lack the section when there are no new contributors;
          # an empty nc.md appends nothing
          [[ -s nc.md ]] && { printf '\n'; cat nc.md; } >> body.md
          [[ -n "${CHANGELOG:-${FALLBACK_CHANGELOG:-}}" ]] \
            && printf '\n%s\n' "${CHANGELOG:-${FALLBACK_CHANGELOG:-}}" >> body.md
          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Driver ${{ needs.version.outputs.version }}
          prerelease: false
          # Latest 徽章永远留给 FFmpeg 的滑动 latest 产物 release——
          # 驱动 release 戴徽章会抢产品位，且会让 scheduled.yml 的首建门
          # 误判（/releases/latest 查的是徽章不是 tag）
          # the Latest badge belongs to FFmpeg's floating `latest`
          # product release — a badged driver release would both steal
          # the product slot and fool scheduled.yml's first-build gate
          # (/releases/latest queries the badge, not the tag)
          make_latest: false
          body_path: body.md
          files: assets/*

      # 浮动 Driver-Latest 桶：与 FFmpeg 的 latest 同模型——每次发布
      # 重建指向最新，scheduled.yml 永远从这下载"最新驱动"。正文直接用
      # 版本 release 的 body.md——与最新 tag 的 release 逐字同步。
      # 同样不戴 Latest 徽章（徽章专属于 FFmpeg latest）。
      # Floating Driver-Latest bucket, same model as FFmpeg's `latest`:
      # rebuilt on every publish to point at the newest binaries, and
      # scheduled.yml always downloads "the newest driver" from it. Its
      # body reuses the versioned release's body.md — literally in sync
      # with the newest tag's release. It never wears the Latest badge
      # either (the badge is FFmpeg-latest-only).
      - name: Update floating Driver-Latest release
        run: |
          set -euo pipefail
          gh release delete Driver-Latest --cleanup-tag --yes || true
          sleep 5
          gh release create Driver-Latest \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Driver Latest" \
            --notes-file body.md \
            --latest=false \
            assets/*
          # 与 deps.rs 同款定针：tag 删除是最终一致的，create 若抢在
          # 旧 tag 消失前完成会把 release 挂回旧 tag（--target 只在新建
          # tag 时生效）——PATCH refs 保证 tag 确定指向本趟 commit。
          # Same pin as deps.rs: tag deletion is eventually consistent —
          # if create lands before the old tag is gone, the release
          # attaches to the stale tag (--target only applies to a new
          # tag). PATCH the ref so the tag deterministically points at
          # this run's commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Driver-Latest" \
            -f "sha=${{ needs.version.outputs.sha }}" -F force=true

  # ── 发布 FFmpeg 产物 / Publish the FFmpeg products ──────────────────
  # 绿 CI 的 ffmpeg-<p> artifact 直接发布（verify 腿在干净机冒烟过四
  # 变体后重传的那份，不是裸 build-*）：日期 tag + latest 滑动桶 +
  # 旧 release 修剪——原 build.yml release job 的整段逻辑平移，只改产
  # 物来源（跨 run 拉取）与 FFmpeg commit 解析（payload 优先，包内
  # BUILDINFO.info 兜底）。
  # A green CI's ffmpeg-<p> artifacts ship as-is (the copies its verify
  # legs re-uploaded after smoking all four variants on clean machines —
  # not the raw build-*): dated tag + floating latest bucket + old-
  # release pruning — the whole release job lifted from build.yml,
  # changing only where the artifacts come from (cross-run download) and
  # how the FFmpeg commit resolves (payload first, the in-archive
  # BUILDINFO.info as fallback).
  ffmpeg-release:
    name: Publish FFmpeg release
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read # cross-run artifact download
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_REF: ${{ needs.version.outputs.sha }}
      BRANCH: ${{ github.ref_name }}
      # One release every push, so 30 releases is roughly the last month.
      KEEP_RELEASES: "30"
    steps:
      - name: Check out this repository (for .github/scripts/)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Download verified builds (from the CI run)
        uses: actions/download-artifact@v8
        with:
          # ffmpeg-* = CI verify 腿冒烟后重传的产物；build-* 是裸产物
          # 留档，不作发布源 / ffmpeg-* = the CI verify legs' post-smoke
          # re-upload; build-* is the raw archive, never the source
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts
          run-id: ${{ needs.version.outputs.run_id }}
          github-token: ${{ github.token }}

      # FFmpeg 源 commit：payload 实解值优先，包内 BUILDINFO.info 兜底
      # （"实际构建的 commit"的权威出处）/ FFmpeg source commit: the
      # payload's resolved value wins, falling back to the BUILDINFO.info
      # inside a shipped archive (the authoritative record of the
      # actually-built commit)
      - name: Resolve FFmpeg commit
        run: |
          set -euo pipefail
          sha="${{ needs.version.outputs.ffmpeg_sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            f="$(ls artifacts/ffmpeg-*.tar.xz artifacts/ffmpeg-*.7z 2>/dev/null | head -n1)"
            [[ -n "$f" ]] || { echo "::error::no product archive to read BUILDINFO from"; exit 1; }
            case "$f" in
              *.7z) sha="$(7z x -so "$f" "*/BUILDINFO.info" | sed -n 's|.*/commit/||p' | head -n1)" ;;
              *)    sha="$(tar -xOf "$f" "*/BUILDINFO.info" | sed -n 's|.*/commit/||p' | head -n1)" ;;
            esac
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve built FFmpeg commit"; exit 1; }
          echo "FFMPEG_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "FFMPEG_HASH=${sha:0:10}" >> "$GITHUB_ENV"
          echo "Built FFmpeg commit $sha"

      # Only FFmpeg's `configure` is used, to list every external library it
      # knows, for the completeness table in the release notes.
      - name: Fetch FFmpeg source (for the library list)
        run: |
          set -euo pipefail
          git init -q ffmpeg-src
          # 仓源顺序与 prepare 同款——官方 git:// 优先，github 兜底 /
          # same repo order as prepare — official git:// first, github
          # as fallback
          fetched=""
          for repo in git://git.ffmpeg.org/ffmpeg.git https://github.com/FFmpeg/FFmpeg.git; do
            git -C ffmpeg-src fetch -q --depth 1 "$repo" "$FFMPEG_COMMIT" && { fetched=1; break; }
          done
          [[ -n "$fetched" ]] || { echo "::error::fetch $FFMPEG_COMMIT failed on all repos"; exit 1; }
          git -C ffmpeg-src -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FFMPEG_SRC=$PWD/ffmpeg-src" >> "$GITHUB_ENV"

      - name: Create dated release
        run: |
          set -euo pipefail
          ls -lh artifacts/

          # Belt and braces: refuse to publish unless every platform is present,
          # built from the pinned commit, with its checksum — all four
          # variants (static/shared/debug/shared-debug) per platform,
          # 40 files total.
          files=()
          for p in windows-x86_64 windows-arm64 linux-x86_64 linux-arm64 macos-arm64; do
            ext="tar.xz"
            [[ "$p" == windows-* ]] && ext="7z"
            for v in "" "-shared" "-debug" "-shared-debug"; do
              base="artifacts/ffmpeg-$FFMPEG_HASH-$p$v"
              for f in "$base.$ext" "$base.$ext.sha256"; do
                [[ -f "$f" ]] || { echo "::error::missing $f"; exit 1; }
                files+=("$f")
              done
            done
          done
          all=(artifacts/*)
          [[ ${#all[@]} -eq ${#files[@]} ]] || { echo "::error::unexpected files in artifacts/: ${all[*]}"; exit 1; }
          (cd artifacts && sha256sum -c -- *.sha256)

          if [ "$BRANCH" != "master" ]; then
            # 非 master 分支：tag 带分支名，发 pre-release / non-master:
            # branch name in the tag, published as a pre-release
            safe="$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
            TAG="$safe-$(date -u +%Y%m%d-%H%M)"
            PRE="--prerelease"
            TITLE="FFmpeg $FFMPEG_HASH 预发布构建 / pre-release build ($BRANCH, $(date -u +'%Y-%m-%d %H:%M') UTC)"
            LATEST="--latest=false"
          else
            # 日期 tag（YYYYMMDD）；同日第二次构建加 -HHMM 后缀防撞
            # date tag (YYYYMMDD); a second same-day build gains a -HHMM
            # suffix to avoid the collision
            TAG="$(date -u +%Y%m%d)"
            gh release view "$TAG" >/dev/null 2>&1 && TAG="$TAG-$(date -u +%H%M)"
            PRE=""
            TITLE="FFmpeg $FFMPEG_HASH CI 构建 / CI build $(date -u +'%Y-%m-%d %H:%M') UTC"
            LATEST="--latest=false"
          fi
          bash .github/scripts/release-notes.sh "$TAG" artifacts > notes.md

          gh release create "$TAG" \
            --target "$TARGET_REF" \
            --title "$TITLE" \
            --notes-file notes.md \
            $PRE $LATEST \
            "${files[@]}"

      # A floating "latest" release with hash-less file names, so download
      # links never change (master builds only — pre-releases never touch it):
      #   https://github.com/<owner>/<repo>/releases/latest/download/ffmpeg-latest-windows-x86_64.7z
      - name: Update "latest" release
        if: env.BRANCH == 'master'
        run: |
          set -euo pipefail
          mkdir latest
          # 四个变体（默认/-shared/-debug/-shared-debug）都进 latest——
          # URL 名即形态 / all four variants
          # (default/-shared/-debug/-shared-debug) land in latest — the
          # URL spells out the shape
          re='^ffmpeg-[0-9a-f]{10}-(windows-x86_64|windows-arm64|linux-x86_64|linux-arm64|macos-arm64)(-shared|-debug|-shared-debug)?\.(7z|tar\.xz)$'
          for f in artifacts/*.7z artifacts/*.tar.xz; do
            name="$(basename "$f")"
            [[ "$name" =~ $re ]] || { echo "::error::unexpected archive name $name"; exit 1; }
            p="${BASH_REMATCH[1]}"
            new="ffmpeg-latest-$p${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            cp "$f" "latest/$new"
            # Same-named checksum file; it has to reference the new file name.
            (cd latest && sha256sum -- "$new" > "$new.sha256")
          done
          # 正文与刚发的日期 tag release 逐字同步（同一份 notes.md；
          # 里面的链接指向日期 tag 资产，永久有效）
          # body synced verbatim with the just-published dated release
          # (the same notes.md; its links point at dated-tag assets,
          # which stay valid forever)
          gh release delete latest --cleanup-tag --yes || true
          sleep 10
          gh release create latest \
            --target "$TARGET_REF" \
            --title "Latest" \
            --notes-file notes.md \
            --latest \
            latest/*
          # 与 deps.rs 同款定针：tag 删除是最终一致的，create 若抢在
          # 旧 tag 消失前完成会把 release 挂回旧 tag（--target 只在新建
          # tag 时生效）——PATCH refs 保证 tag 确定指向本趟 commit。
          # Same pin as deps.rs: tag deletion is eventually consistent —
          # if create lands before the old tag is gone, the release
          # attaches to the stale tag (--target only applies to a new
          # tag). PATCH the ref so the tag deterministically points at
          # this run's commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f "sha=$TARGET_REF" -F force=true

      - name: Prune old releases
        run: |
          set -euo pipefail
          # 修剪对象：日期 tag（^YYYYMMDD，留最新 KEEP_RELEASES 个）与分支
          # pre tag（*-\d{8}-\d{4}$，留最新 10 个）；latest/deps/Driver-*
          # 永远不匹配这两个模式，不会被误删。
          # prune targets: date tags (^YYYYMMDD, newest KEEP_RELEASES kept)
          # and branch pre tags (*-\d{8}-\d{4}$, newest 10 kept);
          # latest/deps/Driver-* match neither pattern and are never
          # touched.
          gh release list --limit 200 --json tagName,createdAt \
            | jq -r --argjson keep "$KEEP_RELEASES" \
                '[.[] | select(.tagName | test("^[0-9]{8}"))] | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r tag; do
                echo "deleting old release $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
          gh release list --limit 200 --json tagName,createdAt \
            | jq -r '[.[] | select(.tagName | test("-[0-9]{8}-[0-9]{4}$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "deleting old pre-release $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
