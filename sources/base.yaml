# 基础源码：FFmpeg 本体与恒启用基础库（对应 features/base.yaml 的键）。
# Base sources: FFmpeg itself and the always-enabled base libraries
# (matching the keys in features/base.yaml).
#
# 取值形式 / value forms:
#   git: <url>             git 仓库——构建期一律按 hash 钉死检出，不做任何解析
#   mirrors: [<url>, ...]  git 仓源回退镜像（主仓克隆失败按序尝试）
#   lock: <40-hex>         完全冻结——只指 sha，机器永不触碰；上游停滞
#                          （HEAD 四年无新提交）时 update-sources 自动
#                          转换落此键并拆除 ref/pin
#   ref: <branch|tag|sha>  偏好——机器维护前进：分支形=跟分支走（ref
#                          原样保留，pin 物化 HEAD）；tag/sha 形机器
#                          前进——tag 赢写 tag 名、HEAD 赢直写 sha；
#                          前进只能向前（倒退持有）
#   pin: <40-hex>          hash oracle——tag/branch 形 ref 与无 ref 条
#                          目必备，由程序整体拥有，勿手编；改动 ref 或
#                          新增条目后须重跑 update-sources
#   submodules: true       递归初始化子模块（浅）
#   archive: <url>         固定产物归档（发行 tarball，configure 已烘焙）
#   sha256: <hex>          archive 完整性校验
#
# 优先级：lock > ref(sha) > pin——取源一律按 hash，tag/branch 永不作
# 拉取目标。解析语义（update-sources 手动执行，不在构建期）：ref 无
# 关三路探测（分支 HEAD+日期、CI 绿门、最新版本 tag），按 ref 形态
# 选目标——分支=裸 HEAD；tag=发布轨最新 tag；sha/无 ref=CI 绿门
# →tag 回退（化石日期戳与预发布出局）。
# Priority: lock > ref(sha) > pin — fetching is always by hash, a
# tag/branch is never a fetch target. Resolution semantics (executed
# by update-sources manually, never at build time): ref-independent
# three-fact probing (branch HEAD+date, CI-green gate, newest version
# tag), target selection by ref form — branch = raw HEAD; tag =
# release-track newest tag; sha/no-ref = CI gate -> tag fallback
# (datestamp fossils and pre-releases excluded).

ffmpeg:
  git: git://git.ffmpeg.org/ffmpeg.git            # 官方仓优先（9418 原生协议）/ official repo first (native proto on 9418)
  mirrors:                                        # 主仓克隆失败按序兜底 / ordered fallbacks when the primary clone fails
    - https://github.com/FFmpeg/FFmpeg.git
  ref: master              # FFMPEG_REPO/FFMPEG_REF/FFMPEG_SHA 环境变量仍可覆盖 / env vars still override

zlib:
  git: https://github.com/madler/zlib.git
  pin: a28e8d5acad59823917e4e556a87584a803ac15e  # default branch develop HEAD CI-green
bzip2:
