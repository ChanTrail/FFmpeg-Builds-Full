# macOS arm64 源码：仅本平台×架构需要的库源 + common 值覆盖。
# macOS arm64 sources: sources needed only on this platform+arch, plus
# whole-value overrides of common.yaml.
lcevcdec:
  git: https://github.com/v-novaltd/LCEVCdec.git
uavs3d:
  git: https://github.com/uavs3/uavs3d.git
harfbuzz:
  git: https://github.com/harfbuzz/harfbuzz.git

# pango 的 fribidi 源在 common.yaml——这里只补 mac 才有的配方依赖
# fribidi's source for pango lives in common.yaml — only the recipe deps
# unique to mac are added here
zlib:
  git: https://github.com/madler/zlib.git
  ref: v1.3.1
libpng:
  git: https://github.com/pnggroup/libpng.git
# librsvg 的 Rust 侧要 libfreetype.a；pango 的 pangoft2 后端也用它
# librsvg's Rust side wants libfreetype.a; pango's pangoft2 backend too
freetype:
  git: https://gitlab.freedesktop.org/freetype/freetype.git
