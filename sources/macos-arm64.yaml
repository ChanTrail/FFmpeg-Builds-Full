# macOS arm64 源：仅本平台独占的源 + common/base 的整值覆盖。
# 源规格本身与平台无关——同值条目一律放 common.yaml，这里只留两类：
# ① 平台独占源（配方 targets="mac"）；② 与共享值不同的覆盖。
# macOS arm64 sources: platform-exclusive sources plus whole-value
# overrides of common/base. Source specs are platform-agnostic —
# same-valued entries all live in common.yaml; only two kinds remain
# here: ① platform-exclusive sources (recipe targets="mac") and
# ② overrides that differ from the shared value.

# ---- 覆盖 / overrides ----
zlib:                      # base.yaml 未钉版；mac 钉 v1.3.1 / unpinned in base.yaml; pinned to v1.3.1 on mac
  git: https://github.com/madler/zlib.git
  ref: v1.3.1
