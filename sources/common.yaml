# ---- HDR 支撑链：glslang 是 libplacebo 的 SPIR-V 编译器（linux/mac 无
#      pacman shaderc 可用，glslang 单工程自足、ENABLE_OPT=OFF 可避开
#      SPIRV-Tools/abseil 链）；xxhash 是 libplacebo 缓存哈希提速件；
#      dovi_tool 仓的 dolby_vision 子crate 以 cargo-c capi 产 libdovi
#      （libplacebo 的 DV 重塑后端）/ HDR support chain: glslang is
#      libplacebo's SPIR-V compiler (no pacman shaderc exists on
#      linux/mac; glslang is self-contained in one project, and
#      ENABLE_OPT=OFF avoids the SPIRV-Tools/abseil chain); xxhash
#      speeds up libplacebo's cache hashing; the dolby_vision subcrate
#      of the dovi_tool repo yields libdovi through cargo-c capi
#      (libplacebo's Dolby Vision reshaping backend) ----
glslang:
  git: https://github.com/KhronosGroup/glslang.git
  pin: e1b562a8bed273a02f30b59b66a5d499793cede5  # default branch main HEAD no CI found — fallback tag 16.6.0
