# Windows x86_64 源码：仅本平台×架构需要的库源 + common 值覆盖。
# Windows x86_64 sources: sources needed only on this platform+arch, plus
# whole-value overrides of common.yaml.

# ---- Windows 专属栈（vulkan-loader 备用、spirv-cross、libplacebo；
#      vulkan-headers/vulkan-shim/opencl/LV2 已挪 common.yaml 共享）
#      ---- Windows-only stacks (vulkan-loader spare, spirv-cross,
#      libplacebo; vulkan-headers/vulkan-shim/opencl/LV2 moved to
#      common.yaml) ----
vulkan-loader:
  git: https://github.com/KhronosGroup/Vulkan-Loader.git
spirv-cross:
  git: https://github.com/KhronosGroup/SPIRV-Cross.git
libplacebo:
  git: https://code.videolan.org/videolan/libplacebo.git
  submodules: true

# ---- x86-only 库 / x86-only libraries ----
libvpl:
  git: https://github.com/intel/libvpl.git
svtjpegxs:
  git: https://github.com/OpenVisualCloud/SVT-JPEG-XS.git
lcevcdec:
  git: https://github.com/v-novaltd/LCEVCdec.git
uavs3d:
  git: https://github.com/uavs3/uavs3d.git
davs2:
  git: https://github.com/pkuvcl/davs2.git
xavs2:
  git: https://github.com/pkuvcl/xavs2.git
  ref: eae1e8b9d12468059bdd7dee893508e470fa83d8   # 上游停滞，固化末次提交（2019-04）/ upstream stalled, pinned at last commit
