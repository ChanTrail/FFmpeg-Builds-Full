# 杂项/不常用库的源码：与 features/misc.yaml 逐键对应（键序相同）。
# 键是配方源名（feature 名与源名偶有差异，如 libfdk-aac→fdk-aac）。
# 即便特性默认 disable 也声明来源——启用时无需再找地址；无公开源的
# 系统/闭源组件以空规格 {} 留档（loader 登记跳过，不取任何东西）。
# Misc/rare library sources: one-to-one with features/misc.yaml (same
# key order). Keys are recipe source names (feature and source names
# occasionally differ, e.g. libfdk-aac→fdk-aac). Sources are declared
# even when the feature defaults to disable — enabling needs no further
# edit; system/proprietary components without a public repo get an
# empty spec {} for the record (the loader registers-and-skips them).

fdk-aac:                   # libfdk-aac
  git: https://github.com/mstorsjo/fdk-aac.git
openssl:
  git: https://github.com/openssl/openssl.git
# mbedtls 的源在 common.yaml——它是 libssh 的 crypto 后端（真依赖），
# 与"特性 mbedtls: disable"是两回事 / mbedtls's source lives in
# common.yaml — it's libssh's crypto backend (a real dependency), which
# is a different matter from the `mbedtls: disable` feature
gcrypt:
  git: https://github.com/gpg/libgcrypt.git
schannel: {}               # Windows SDK 组件，无独立仓库 / part of the Windows SDK, no standalone repo
libjack:
  git: https://github.com/jackaudio/jack2.git
sndio:
  git: https://caoua.org/git/sndio
# libshaderc/libglslang/libnpp/libcelt：FFmpeg 已移除这些 configure
# 特性，连同 features 键一并删除——不再是"留档可启"，发了旗标就是
# unknown-option / FFmpeg dropped these configure options outright, so
# the feature keys are gone too — emitting a flag would be an
# unknown-option, not a "kept for the record"
cuda-nvcc: {}              # NVIDIA CUDA Toolkit 组件，无独立公开仓库 / part of the NVIDIA CUDA Toolkit, no standalone repo
decklink: {}               # Blackmagic 闭源 SDK，无公开源码地址 / proprietary SDK, no public source
libklvanc:
  git: https://github.com/stoth68000/libklvanc.git
libsmbclient:
  git: https://gitlab.com/samba-team/samba.git
libmfx:
  git: https://github.com/Intel-Media-SDK/MediaSDK.git
libopenvino:
  git: https://github.com/openvinotoolkit/openvino.git
libtensorflow:
  git: https://github.com/tensorflow/tensorflow.git
libtorch:
  git: https://github.com/pytorch/pytorch.git
libopencv:
  git: https://github.com/opencv/opencv.git
