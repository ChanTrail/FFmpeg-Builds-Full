# Linux arm64 源码：仅本平台×架构需要的库源 + common 值覆盖。
# Linux arm64 sources: sources needed only on this platform+arch, plus
# whole-value overrides of common.yaml.
# libvpl/svtjpegxs/davs2/xavs2 为 x86-only，不列。

# ---- Linux 硬件/采集栈 ----
alsa:
  archive: https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.16.1.tar.bz2
  sha256: f740db7f488255944ffd4428416ee3390a96742856916433df468c281436480e
libva:
  git: https://github.com/intel/libva.git
vdpau:
  git: https://gitlab.freedesktop.org/vdpau/libvdpau.git
libdrm:
  git: https://gitlab.freedesktop.org/mesa/drm.git
v4l-utils:
  git: https://git.linuxtv.org/v4l-utils.git
raw1394:
  archive: https://www.kernel.org/pub/linux/libs/ieee1394/libraw1394-2.1.2.tar.xz
  sha256: 03ccc69761d22c7deb1127fc301010dd13e70e44bb7134b8ff0d07590259a55e
dc1394:
  archive: https://downloads.sourceforge.net/project/libdc1394/libdc1394-2/2.2.6/libdc1394-2.2.6.tar.gz
