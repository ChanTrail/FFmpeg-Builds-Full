# X11/xcb/平台栈现由自家静态配方产出（src/recipes/linux/）——系统
# -dev 包退居二线：一为未覆盖库的 .pc 兜底（PKG_CONFIG_LIBDIR 前缀
# 优先、系统垫后），二为不产 .a 的探针/头文件场合留活路；同目录下
# ld 恒优先 .so，靠系统包静态链是死路，已实证 / the X11/xcb/platform
# stack now comes from our own static recipes (src/recipes/linux/) —
# system -dev packages are demoted to two roles: a .pc fallback for
# libraries we don't cover (PKG_CONFIG_LIBDIR puts the prefix first,
# system last) and a header/probe fallback where no .a exists; ld
# always prefers .so in the same directory, so static linking via
# system packages was proven a dead end
- libx11-dev
- libxext-dev
- libxv-dev
- libxcb-shm0-dev
- libxcb-shape0-dev
- libxcb-xfixes0-dev
- libdrm-dev
- libva-dev
- libpulse-dev
# Vulkan：whisper 的 ggml 后端要头+加载库+glslc+SPIRV-Headers cmake
# 包+glslangValidator / Vulkan: whisper's ggml backend wants
# headers+loader+glslc+the SPIRV-Headers cmake package+glslangValidator
- libvulkan-dev
- glslc
- spirv-headers
- glslang-tools
- glslang-dev
# glib：lensfun 要 glib-2.0.pc（含 .a）；其 Requires.private 的
# pcre2/ffi 也须 -dev 才能被 pkg-config 传递解析
# glib: lensfun wants glib-2.0.pc (+.a); its Requires.private needs
# pcre2/ffi -dev for pkg-config to resolve transitively
- libglib2.0-dev
- libpcre2-dev
- libffi-dev
# dc1394 的 USB 后端（raw1394 缺它只丢 USB 不致命，但顺手补上）
# dc1394's USB backend (raw1394-only loses USB, non-fatal, but cheap)
- libusb-1.0-0-dev
