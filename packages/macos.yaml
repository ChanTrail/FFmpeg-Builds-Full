# macOS brew 包栈：runner 镜像自带 xcode 工具链，这里只补 autotools 系
# ——配方从零 autoreconf 需要，brew 的 libtool 是 g- 前缀的。
# macOS brew package stack: the runner image ships the xcode toolchain —
# only the autotools family is added here since recipes autoreconf from
# scratch, and brew's libtool is g-prefixed.
- ccache
- autoconf
- automake
- libtool
- gettext
- zstd
- nasm
- cmake
- meson
- ninja
- pkg-config
# texinfo 是 keg-only（不落 /opt/homebrew/bin 符号链）——makeinfo 由
# env 的 child PATH 直接并 /opt/homebrew/opt/texinfo/bin；configure 的
# makeinfo/makeinfo-HTML 探活要用 / texinfo is keg-only (no symlinks
# into /opt/homebrew/bin) — makeinfo reaches children via the env's
# child PATH folding in /opt/homebrew/opt/texinfo/bin; needed by
# configure's makeinfo/makeinfo-HTML probes
- texinfo
