# Windows arm64 特化：仅本平台×架构的启用项（键不得与其他文件重复）。
# libvpl/svtjpegxs/lcevcdec/uavs3d/davs2/xavs2 均为 x86-only，不列。
# Windows arm64 specifics: enable entries for this platform+arch only.
# libvpl/svtjpegxs/lcevcdec/uavs3d/davs2/xavs2 are x86-only — not listed.
d3d11va: enable
d3d12va: enable
dxva2: enable
mediafoundation: enable
cuda-llvm: enable       # libplacebo/glslang 路径的 CUDA 编译器支持 / CUDA compiler support for libplacebo/glslang path
cuvid: enable           # NVIDIA CUVID 解码（ffnvcodec 自动随之）/ NVIDIA CUVID decode (pulls ffnvcodec automatically)
nvdec: enable           # NVIDIA NVDEC 硬件解码 / NVIDIA NVDEC hw decode
nvenc: enable           # NVIDIA NVENC 硬件编码 / NVIDIA NVENC hw encode
