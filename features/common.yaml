libx265: enable
libaom: enable
libdav1d: enable
libvpx: enable
libsvtav1: enable
librav1e: enable
libjxl: enable
libwebp: enable
libopenjpeg: enable
libtheora: enable
libxvid: enable
libkvazaar: enable
libopenh264: enable
liboapv: enable
libxeve: enable
libxevd: enable
libvvenc: enable

