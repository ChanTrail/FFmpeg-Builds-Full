# 通用库：全平台共享的 FFmpeg 特性开关，值为 enable 或 disable。
# 键不能出现在 base.yaml、misc.yaml 的本平台分节、或本平台文件里——重复即报错。
# Common libraries: FFmpeg feature switches shared by every platform;
# values are enable or disable. A key must not appear in base.yaml, in this
# platform's section of misc.yaml, or in this platform's file — duplicates
# are errors.
#
# 未列出的已知特性一律按 --disable 处理（严格默认关闭）。
# Known features absent from every file resolve to --disable (strict).

# ---- 视频编解码 / video codecs ----
