# macOS arm64 特化：本平台独有的启用项（键不得与其他文件重复）。
# 多平台共享项请改 features/common.yaml，杂项请改 features/misc.yaml。
# macOS arm64 specifics: enable entries exclusive to this platform
# (keys must not duplicate other files). Multi-platform shared items
# belong in features/common.yaml; misc items in features/misc.yaml.
videotoolbox: enable
avfoundation: enable
audiotoolbox: enable
appkit: enable
coreimage: enable
metal: enable
securetransport: enable    # Apple 系统 TLS：钥匙串/系统 CA / Apple system TLS: keychain + system CA store
ladspa: enable             # ladspa 配方仅 mac（targets="mac"）/ the ladspa recipe is mac-only (targets="mac")
