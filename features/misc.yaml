# 杂项/不常用库：刻意关闭或仅留档的已知特性，键全局唯一。
# 值形态与 common.yaml 相同（标量 | {all: v, <os>-<arch>: v}）。
# 有任何平台启用的条目请进 common.yaml（多平台共享）或平台文件（平台独有）。
# Misc/rare libraries: known features deliberately disabled or kept only
# for the record; keys are globally unique. Value shapes match common.yaml
# (scalar | {all: v, <os>-<arch>: v}). Entries enabled on any platform
# belong in common.yaml (multi-platform) or a platform file (exclusive).

libfdk-aac: disable      # nonfree，开启即不可再分发 / nonfree — enabling blocks redistribution
openssl: disable         # TLS 走 gnutls；openssl 库仍会作为 srt/rist 依赖构建 / TLS via gnutls; openssl still builds as an srt/rist dep
mbedtls: disable         # 仅作 srt 的私用 TLS 后端进包 / only ever ships as srt's private TLS backend
gcrypt: disable
schannel: disable        # Windows 系统 TLS 后端（不用，统一走 gnutls）/ Windows' system TLS backend (unused — gnutls everywhere)
libjack: disable         # 音频工作站场景 / pro-audio
sndio: disable
# libshaderc/libglslang/libnpp/libcelt：上游 FFmpeg 已删这些特性——
# 连 disable 都不能再发（unknown-option 拒配），键从 FEATURES 表移除 /
# upstream FFmpeg removed these options — even --disable-* now fails as
# an unknown option, so the keys left the FEATURES table
cuda-nvcc: disable
decklink: disable        # 需要 Blackmagic SDK / needs the Blackmagic SDK
libklvanc: disable
libsmbclient: disable
libmfx: disable          # 已被 libvpl 取代 / superseded by libvpl
libopenvino: disable
libtensorflow: disable
libtorch: disable
libopencv: disable
