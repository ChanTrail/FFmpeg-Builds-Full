# Windows x86_64 特化：仅本平台×架构的启用项（键不得与其他文件重复）。
# libpulse/ladspa 等杂项请改 features/misc.yaml 的本平台分节。
# Windows x86_64 specifics: enable entries for this platform+arch only.
# For misc items (libpulse/ladspa/...) edit this platform's misc.yaml section.
d3d11va: enable
d3d12va: enable
dxva2: enable
mediafoundation: enable
cuda-llvm: enable       # libplacebo/glslang 路径的 CUDA 编译器支持 / CUDA compiler support for libplacebo/glslang path
cuvid: enable           # NVIDIA CUVID 解码（ffnvcodec 自动随之）/ NVIDIA CUVID decode (pulls ffnvcodec automatically)
nvdec: enable           # NVIDIA NVDEC 硬件解码 / NVIDIA NVDEC hw decode
nvenc: enable           # NVIDIA NVENC 硬件编码 / NVIDIA NVENC hw encode
libvpl: enable          # Intel QSV 运行时（x86 only）/ Intel QSV runtime, x86 only
libsvtjpegxs: enable    # JPEG-XS 编解码（x86 only）/ JPEG-XS codec, x86 only
liblcevc-dec: enable    # LCEVC 增强层解码（x86 only）/ LCEVC enhancement decode, x86 only
libuavs3d: enable       # AVS3 解码（x86 only）/ AVS3 decode, x86 only
libdavs2: enable        # AVS2 解码（x86 only）/ AVS2 decode, x86 only
libxavs2: enable        # AVS2 编码（x86 only）/ AVS2 encode, x86 only
libxavs: enable         # AVS 编码 / AVS encode
