# Linux arm64 特化：仅本平台×架构的启用项（键不得与其他文件重复）。
# libvpl/svtjpegxs/lcevcdec/uavs3d/davs2/xavs2 均为 x86-only，不列。
# Linux arm64 specifics: enable entries for this platform+arch only.
# libvpl/svtjpegxs/lcevcdec/uavs3d/davs2/xavs2 are x86-only — not listed.
vaapi: enable
vdpau: enable
libdrm: enable
alsa: enable
libdc1394: enable
libxcb: enable
libxcb-shm: enable
libxcb-shape: enable
libxcb-xfixes: enable
xlib: enable
liblcevc-dec: enable    # LCEVC 有 arm64 支持 / LCEVC ships arm64 support
libuavs3d: enable       # AVS3 解码有 arm64 汇编 / AVS3 decode has arm64 asm
v4l2m2m: enable
nvdec: enable
nvenc: enable
cuvid: enable
vulkan: enable          # 前缀 shim（头+dlopen 加载器）/ prefix shim (headers + dlopen loader)
opencl: enable          # 前缀 ICD shim / prefix ICD shim
ffnvcodec: enable       # nv-codec-headers 头文件 / nv-codec-headers headers
vapoursynth: enable     # 配方覆盖 linux；mac 出局见 common.yaml 注 / recipe covers linux; mac is out, see common.yaml note
